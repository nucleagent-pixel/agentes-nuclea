<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina NUCLEA</title>
<meta name="theme-color" content="#2a2622">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a2622'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='900' font-size='18' fill='%23f3c98b'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="barra">
  <div class="marca">Oficina <b>NUCLEA</b> <span id="modo" class="chip" hidden>Demo</span></div>
  <div id="sesion" class="sesion"></div>
</header>

<main id="app">
  <section id="pantalla-entrar" class="centro" hidden>
    <h1>Oficina NUCLEA</h1>
    <p>Entra con tu cuenta de Google del equipo.</p>
    <button id="b-entrar" class="btn">Entrar con Google</button>
    <p id="err-entrar" class="error"></p>
  </section>

  <section id="pantalla-sin-acceso" class="centro" hidden>
    <h1>Todavía no tienes acceso</h1>
    <p>Pídele a Nicole que agregue tu correo <b id="correo-sin-acceso"></b> al equipo.</p>
    <button id="b-salir2" class="btn btn-sec">Salir</button>
  </section>

  <section id="pantalla-oficina" hidden>
    <p class="nota pista">Toca a un agente para abrir su chat.</p>
    <div class="mundo"><canvas id="mundo" aria-label="Oficina virtual con los tres agentes"></canvas></div>
    <div class="acciones">
      <h2>Tablero de productos</h2>
      <div class="derecha">
        <button id="b-chats" class="btn btn-sec" hidden>Chats</button>
        <button id="b-equipo" class="btn btn-sec" hidden>Equipo</button>
        <button id="b-nuevo" class="btn">+ Nuevo producto</button>
      </div>
    </div>
    <p id="err-datos" class="error"></p>
    <div id="tablero" class="tablero"></div>
  </section>
</main>

<dialog id="d-producto"></dialog>
<dialog id="d-nuevo">
  <form method="dialog" id="f-nuevo" class="formulario">
    <h3>Nuevo producto</h3>
    <label>Nombre de trabajo<input name="nombre" required maxlength="80" placeholder="Ej.: Reto Pilates en la Silla 21D"></label>
    <label>País de destino<select name="pais" id="s-pais"></select></label>
    <div class="botones"><button value="cancelar" formnovalidate class="btn btn-sec">Cancelar</button><button value="ok" class="btn">Crear</button></div>
  </form>
</dialog>
<dialog id="d-equipo"></dialog>
<dialog id="d-chats"></dialog>
<div id="aviso" class="aviso" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
